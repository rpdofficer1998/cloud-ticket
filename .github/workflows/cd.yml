name: CloudTicket CD Smoke Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Debug OIDC claims
        shell: bash
        run: |
          OIDC_TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f 2)

          # Add missing Base64 padding
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d | jq '{sub, aud}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::312957452590:role/GitHubActionsCloudTicketRole
          aws-region: ap-southeast-2

      - name: Test SSM connection
        shell: bash
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-059c48b0fafd75b14 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["echo CloudTicket CD works","hostname","docker --version"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-059c48b0fafd75b14 \
              --query "Status" \
              --output text)

            echo "Attempt $i: $STATUS"

            case "$STATUS" in
              Success)
                echo "SSM command succeeded."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-059c48b0fafd75b14 \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "SSM command failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-059c48b0fafd75b14 \
                  --query "[Status,StandardErrorContent,StandardOutputContent]" \
                  --output text
                exit 1
                ;;
            esac

            sleep 2
          done

          echo "SSM command did not finish within the expected time."
          exit 1       
